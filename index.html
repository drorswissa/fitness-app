
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App – Muscle Groups</title>

  <style>
    :root {
      --bg: #0b1017;
      --panel: #111827;
      --panel-2: #162033;
      --panel-3: #0c1320;
      --text: #f5f7fb;
      --muted: #9eabc3;
      --line: rgba(255,255,255,0.08);
      --accent: #2bd3a0;
      --accent-2: #1eb885;
      --danger: #ff6f6f;
      --shadow: 0 10px 28px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #08101a 0%, #0b1017 100%);
      color: var(--text);
    }

    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 12px 12px 190px;
    }

    .stack { display: grid; gap: 12px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .mini-btn {
      min-width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
    }

    .screen-timer {
      font-size: 28px;
      font-weight: 800;
      text-align: center;
      flex: 1;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-card {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
    }

    .day-card small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-weight: 400;
      font-size: 11px;
    }

    .day-card.active {
      outline: 2px solid rgba(43,211,160,.35);
      background: rgba(43,211,160,.10);
    }

    .progress-track {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(34px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .progress-step {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 999px;
      background: #000;
      border: 1px solid var(--line);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      opacity: .9;
      cursor: pointer;
    }

    .progress-step.active {
      background: var(--accent);
      color: #052017;
    }

    .progress-step.done-step {
      background: rgba(43,211,160,.22);
      color: #baf8dd;
      border-color: rgba(43,211,160,.28);
    }

    .progress-bar {
      height: 7px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 0 2px 14px;
      border: 1px solid rgba(255,255,255,.045);
    }

    #progressFill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #71f0c3, var(--accent-2));
      box-shadow: 0 0 18px rgba(43,211,160,.28);
      transition: width .45s ease;
    }

    .hero-image {
      width: 100%;
      height: 176px;
      object-fit: contain;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      padding: 8px;
    }

    .exercise-title {
      font-size: 18px;
      font-weight: 800;
      margin-top: 14px;
      line-height: 1.2;
    }

    .exercise-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button, input, select, a.linkbtn { font: inherit; }

    button, a.linkbtn {
      border: none;
      border-radius: 16px;
      padding: 11px 13px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .primary {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #082217;
      font-weight: 800;
    }

    .secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .full { width: 100%; }

    .sets-card {
      margin-top: 14px;
      display: grid;
      gap: 10px;
    }

    .set-row {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-columns: 40px 1fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .set-row.active {
      box-shadow: inset 0 0 0 2px rgba(43,211,160,.35);
      background: rgba(43,211,160,.08);
    }

    .set-index {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a313d;
      font-weight: 700;
      color: var(--text);
    }

    .input-wrap {
      display: grid;
      grid-template-columns: 54px auto;
      gap: 8px;
      align-items: center;
    }

    .tiny-input {
      width: 100%;
      background: #020406;
      border: 1px solid rgba(255,255,255,.05);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }

    .unit {
      color: var(--muted);
      font-size: 13px;
    }

    .icon-btn {
      min-width: 42px;
      height: 42px;
      border: none;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #0a0e14;
      color: var(--text);
      cursor: pointer;
      border: 1px solid var(--line);
      font-size: 16px;
    }

    .icon-btn.done {
      background: rgba(43,211,160,.16);
      color: #8ff3cb;
      border-color: rgba(43,211,160,.26);
    }

    .timer-footer {
      position: sticky;
      bottom: 92px;
      background: rgba(20,26,35,.96);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      box-shadow: var(--shadow);
      margin-top: 14px;
      z-index: 4;
    }

    .footer-block { text-align: center; }
    .footer-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .footer-time { font-size: 20px; font-weight: 800; }

    .footer-btn {
      border: none;
      border-radius: 16px;
      padding: 14px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-btn.done {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #062117;
    }

    .footer-btn.rest {
      background: #05080d;
      color: #d7dfef;
      border: 1px solid var(--line);
    }

    .section.hidden { display: none; }
    .section-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 6px;
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    .stat-box strong {
      display: block;
      font-size: 20px;
      margin-top: 4px;
    }

    .history-item {
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 11px;
      margin-bottom: 8px;
    }

    .history-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .history-delete-btn {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(255,111,111,.13);
      color: #ffb1b1;
      border: 1px solid rgba(255,111,111,.25);
      padding: 0;
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px 10px;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .history-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 6px;
      margin-bottom: 12px;
    }

    .history-tab {
      border-radius: 14px;
      padding: 10px 8px;
      background: transparent;
      color: var(--muted);
      border: none;
      font-weight: 800;
    }

    .history-tab.active {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      color: #062117;
    }

    .progress-controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .progress-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .progress-summary .stat-box strong { font-size: 17px; }

    .progress-chart-card {
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-chart-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .progress-chart { width: 100%; height: 150px; display: block; }
    .progress-table { display: grid; gap: 8px; }

    .progress-table-row {
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    .progress-table-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .progress-sets {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .positive { color: #7cf0bd; }
    .negative { color: #ffb1b1; }


    .walk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .walk-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: none;
      z-index: 19;
    }

    .sheet-backdrop.open { display: block; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 82px;
      max-width: 430px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      max-height: 62vh;
      overflow: auto;
      display: none;
      z-index: 20;
      box-shadow: var(--shadow);
    }

    .sheet.open { display: block; }

    input, select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 10px 11px;
      outline: none;
      margin-top: 8px;
    }

    .library-item {
      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: grid;
      grid-template-columns: 54px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }

    .library-item img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 4px;
    }

    .fixed-spotify {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: min(430px, 100vw);
      background: rgba(10,14,20,.96);
      border-top: 1px solid var(--line);
      padding: 8px 10px 10px;
      z-index: 30;
      backdrop-filter: blur(10px);
    }

    .spotify-mini-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
      text-align: center;
    }

    iframe.spotify-bar {
      width: 100%;
      height: 80px;
      border: none;
      border-radius: 16px;
    }

    button, .icon-btn, .day-card, .progress-step, .history-delete-btn, a.linkbtn {
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease, opacity .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:active, .icon-btn:active, .day-card:active, .progress-step:active, a.linkbtn:active {
      transform: scale(.96);
    }

    .card {
      box-shadow:
        0 14px 34px rgba(0,0,0,.32),
        0 2px 10px rgba(43,211,160,.045);
    }

    .next-exercise-preview {
      margin-top: 10px;
      border-radius: 18px;
      border: 1px solid rgba(43,211,160,.16);
      background: linear-gradient(180deg, rgba(43,211,160,.09), rgba(255,255,255,.025));
      padding: 10px 12px;
      display: grid;
      gap: 4px;
    }

    .next-exercise-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .next-exercise-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.25;
    }

    body.focus-mode .days-grid,
    body.focus-mode .stats-grid,
    body.focus-mode #statsSection .section-title {
      display: none !important;
    }

    /* 2026 visual refresh - muscle groups */
    .app{max-width:520px;padding:16px 14px 40px}
    .card{border-radius:28px;background:linear-gradient(180deg,#101b2c 0%,#0c1625 100%);border-color:rgba(67,231,190,.12)}
    .topbar{padding:4px 2px 8px}.screen-timer{font-size:34px;letter-spacing:1px}

    .day-card:before{content:'🏋️';font-size:22px;margin-bottom:7px}.day-card.active{outline:none;border-color:#20dfb0;box-shadow:0 0 0 2px rgba(32,223,176,.18),0 10px 30px rgba(0,0,0,.22);background:linear-gradient(180deg,rgba(25,211,166,.20),rgba(17,45,52,.65))}
    .day-card small{font-size:10px}.group-edit-compact{width:auto!important;margin:0 0 14px!important;padding:8px 12px!important;border-radius:12px!important;font-size:12px;float:left}

    .next-exercise-preview{border-radius:18px}.action-row.media-actions{display:grid;grid-template-columns:repeat(3,1fr)}

    .footer-label{font-size:13px}.footer-time{font-size:36px;color:#20dfb0;letter-spacing:1px}.footer-btn{min-height:52px}
    .sets-card{background:rgba(4,12,20,.30);border-radius:22px;padding:10px}.set-row{border-radius:16px}
    .fixed-spotify,.spotify-mini-label,.spotify-bar{display:none!important}.app{padding-bottom:40px}
    .bottom-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}.bottom-nav button{min-height:50px}
    @media(max-width:430px){.days-grid{grid-template-columns:1fr}.day-card{min-height:68px;flex-direction:row;gap:8px}.day-card:before{margin:0}.hero-image{height:205px}.timer-footer{grid-template-columns:1fr 1fr 1fr}.footer-time{font-size:28px}}

    /* Exercise warehouse */
    .workout-tools{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;clear:both;margin:8px 0 14px}
    .warehouse-btn{background:linear-gradient(180deg,rgba(25,211,166,.18),rgba(12,31,42,.9));border:1px solid #20dfb0!important;color:#eafff9!important;font-weight:900;min-height:52px}
    .warehouse-btn span{font-size:20px;margin-left:7px}
    .library-sheet-modern{max-height:82vh;bottom:12px;border-color:rgba(32,223,176,.32);background:linear-gradient(180deg,#0e1b2b,#09131f);padding:16px}
    .library-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .library-title-row .section-title{margin:0;font-size:22px}.library-close{width:40px;height:40px;border-radius:50%;padding:0}
    .library-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.library-filters #searchInput{grid-column:1/-1}
    .library-chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}.library-chips::-webkit-scrollbar{display:none}
    .library-chip{white-space:nowrap;padding:8px 13px;border-radius:999px;background:#132238;color:var(--muted);border:1px solid var(--line);font-size:12px}
    .library-chip.active{background:rgba(32,223,176,.17);color:#8ff3d4;border-color:#20dfb0}
    #libraryList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .library-item{display:flex;flex-direction:column;align-items:stretch;margin:0;padding:8px;border-radius:18px;overflow:hidden}
    .library-item img{width:100%;height:112px;border-radius:13px}.library-item-info{padding:8px 4px 5px}.library-item .primary{width:100%;margin-top:auto}
    @media(max-width:430px){.workout-tools{grid-template-columns:1fr 1fr}.library-sheet-modern{max-height:88vh}.library-filters{grid-template-columns:1fr}#libraryList{grid-template-columns:repeat(2,minmax(0,1fr))}.library-item img{height:95px}}
  </style>
</head>
